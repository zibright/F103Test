name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            cmake \
            ninja-build

      - name: Show toolchain versions
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset Release

      - name: Build
        run: cmake --build --preset Release

      - name: Prepare release assets
        id: assets
        run: |
          # 标签里允许出现 "/"，替换成 "-" 避免生成不存在的目录或非法 artifact 名
          VERSION="${GITHUB_REF_NAME//\//-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp "build/Release/Project.elf" "dist/Project-${VERSION}.elf"
          cp "build/Release/Project.bin" "dist/Project-${VERSION}.bin"
          cp "build/Release/Project.hex" "dist/Project-${VERSION}.hex"
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.assets.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
